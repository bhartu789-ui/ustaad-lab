<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CertifyPro — Certificate Studio</title><meta name="description" content="Generate, issue, print and verify school certificates."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',Arial,sans-serif;color:#14233c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit;text-decoration:none}.layout{display:grid;grid-template-columns:246px 1fr;min-height:100vh}.nav{background:#112541;color:#b9c7dc;padding:30px 15px}.brand{font-weight:800;font-size:26px;color:white;padding:0 16px 35px;display:flex;align-items:center;gap:11px}.brand i{background:#d7ad65;border-radius:9px;color:#142745;padding:8px;font-style:normal}.brand b{color:#eac989}.nav button{width:100%;text-align:left;display:block;padding:14px 17px;background:transparent;border:0;color:#b9c7dc;border-radius:10px;margin-bottom:6px;font-weight:700}.nav button.active,.nav button:hover{background:#243d5c;color:#fff}.nav .foot{font-size:12px;position:sticky;top:90vh;padding:20px 15px;color:#95abc8}.main{padding:36px 4.2%;max-width:1650px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.15em;color:#b28743;font-weight:800;text-transform:uppercase}.top h1{font-size:32px;margin:8px 0}.muted{color:#718099}.top p{margin:0;color:#718099}.btn{border:1px solid #d8dfe9;background:#fff;padding:12px 17px;border-radius:10px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:#172c4e;color:#fff;border-color:#172c4e}.btn.gold{background:#c99f56;color:#fff;border-color:#c99f56}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.card,.panel{border:1px solid #e6ebf1;background:#fff;border-radius:16px;box-shadow:0 5px 22px #16315509}.card{padding:18px 20px}.card small{color:#8a98aa}.card strong{display:block;font-size:27px;margin-top:9px}.workspace{display:grid;grid-template-columns:minmax(320px,.84fr) minmax(420px,1.3fr);gap:20px}.panel{padding:22px}.panel h2{font-size:16px;margin:0 0 5px}.panel .sub{font-size:12px;color:#8593a5;margin:0 0 23px}label{display:block;font-size:12px;font-weight:800;color:#42526a;margin-bottom:14px}input,select,textarea{display:block;margin-top:7px;width:100%;padding:11px 12px;border:1px solid #d9e1eb;border-radius:9px;background:#fff;color:#20324c;outline-color:#bf9858;font-size:13px}textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{font-size:11px;color:#6e7d92;font-weight:800;margin:20px 0 12px;letter-spacing:.1em}.templates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.template{padding:8px 5px;border:1px solid #dbe1e8;background:#fff;border-radius:9px;font-size:11px}.template.selected{border:2px solid #c49a52;background:#fffaf1}.swatch{height:30px;border-radius:5px;margin-bottom:6px}.previewBox{background:#eef2f7;padding:22px;border-radius:12px;overflow:auto}.certificate{width:100%;aspect-ratio:297 / 210;min-width:400px;padding:2.4%;background:#fffdf7;position:relative;text-align:center;border:10px solid #b08a49;box-shadow:0 8px 19px #20335018;color:#172b47;overflow:hidden}.certificate:before{content:"";position:absolute;inset:13px;border:1px solid #b08a49;pointer-events:none}.certificate[data-theme=emerald]{background:#f6fbf8;border-color:#29866d;color:#123e3b}.certificate[data-theme=royal]{background:#f8f9ff;border-color:#5377d1;color:#182b68}.certificate[data-theme=minimal]{background:#fff;border-color:#566273;color:#1e293b}.logo{height:58px;max-width:100px;object-fit:contain;margin:2% auto 1%;display:none}.school{font-size:clamp(10px,1.4vw,22px);font-weight:800;text-transform:uppercase;letter-spacing:.1em;overflow-wrap:anywhere}.smallcaps{font-size:11px;color:#ae894e;letter-spacing:.33em;font-weight:800;margin-top:4%}.certType{font-family:'Libre Baskerville',Georgia,serif;font-size:clamp(22px,3vw,45px);font-weight:800;margin:2% auto}.intro{font-size:13px;color:#708093;margin-top:2%}.student{font-family:'Libre Baskerville',Georgia,serif;font-size:clamp(20px,2.9vw,45px);font-weight:bold;margin:2% auto;overflow-wrap:anywhere}.recognition{font-size:14px;margin:2% auto 1%;color:#718095}.course{font:700 clamp(16px,1.7vw,29px) Georgia,serif;margin:2% auto;overflow-wrap:anywhere}.detail{font-size:12px;color:#667387;min-height:24px}.certBottom{position:absolute;bottom:5%;left:5%;right:5%;display:flex;justify-content:space-between;align-items:end;text-align:center;gap:15px;font-size:12px}.certBottom b{display:block;font-size:12px}.qr{width:68px;height:68px;display:block;margin:auto}.signImg{display:none;max-width:130px;max-height:48px;margin:auto}.badge{display:inline-block;background:#e8f7ef;color:#198458;font-size:11px;font-weight:800;border-radius:30px;padding:6px 11px}.badge.warn{background:#fff2d8;color:#aa7b25}.previewActions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.notice{padding:13px 15px;background:#f1f7ff;border-radius:10px;margin-top:15px;font-size:13px}.notice.bad{background:#fff0f0;color:#a02727}.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:30px;text-align:center;margin:18px 0;position:relative}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;color:#77889e;background:#f6f8fb}td,th{padding:13px;border-bottom:1px solid #edf0f4}td{vertical-align:middle}.hidden{display:none!important}.auth{position:fixed;inset:0;background:#0a1725a9;display:grid;place-items:center;padding:20px;z-index:10}.login{background:#fff;border-radius:18px;padding:30px;max-width:420px;width:100%}.login h2{margin:0}.authActions{display:flex;gap:10px}.verifyLayout{max-width:580px;margin:8vh auto;padding:24px}.verifyLayout .panel{text-align:center;padding:36px}.verifyLayout h1{font-size:32px}.verifyResults{text-align:left;margin-top:20px}.verifyResults p{border-bottom:1px solid #eee;padding-bottom:10px}#toast{position:fixed;right:25px;bottom:22px;padding:14px 18px;background:#142941;color:white;border-radius:9px;display:none;z-index:30;max-width:350px}#printArea{display:none}@media(max-width:1100px){.workspace{grid-template-columns:1fr}.main{padding:25px}}@media(max-width:750px){.layout{display:block}.nav{padding:12px;display:flex;align-items:center;overflow:auto}.brand{padding:4px 10px;font-size:18px;white-space:nowrap}.nav button{width:auto;white-space:nowrap;margin:0}.nav .foot{display:none}.cards{grid-template-columns:1fr 1fr}.top{flex-wrap:wrap}.two{grid-template-columns:1fr}.templates{grid-template-columns:repeat(2,1fr)}}@media print{@page{size:A4 landscape;margin:0}body{background:#fff}body>*{display:none!important}#printArea{display:block!important}.printPage{height:210mm;width:297mm;page-break-after:always;break-after:page;overflow:hidden}.printPage .certificate{min-width:0;width:297mm;height:210mm;box-shadow:none;border-width:4mm;padding:10mm}.printPage .certificate:before{inset:4mm}.printPage .logo{height:22mm;max-width:40mm}.printPage .school{font-size:18pt}.printPage .smallcaps{font-size:12pt;margin-top:12mm}.printPage .certType{font-size:37pt}.printPage .intro{font-size:13pt}.printPage .student{font-size:40pt}.printPage .recognition{font-size:13pt}.printPage .course{font-size:25pt}.printPage .detail{font-size:13pt}.printPage .certBottom{font-size:13pt;bottom:11mm}.printPage .certBottom b{font-size:13pt}.printPage .qr{height:23mm;width:23mm}.printPage .signImg{max-width:37mm;max-height:14mm}}
</style></head><body><div id="app"></div><div id="printArea"></div><div id="toast"></div><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date().toISOString().slice(0,10),types=['Achievement','Completion','Participation','Appreciation'],templates=['classic','emerald','royal','minimal'];
let record={student_name:'Anita Kumari',course:'Outstanding Academic Performance',detail:'For dedication, excellence and consistent achievement',cert_type:'Achievement',issue_date:today,template:'classic'},brand={school:'Your School Name',signer:'Principal / Director',logo:'',signature:''},authed=false,configured=false,issued=null,history=[],imported=[],active='studio';
try{brand={...brand,...JSON.parse(localStorage.getItem('certifypro_brand')||'{}')}}catch{}
const request=async(action,options={})=>{const r=await fetch('/api?action='+action,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json'}});const j=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(j.error||'Request failed');return j};
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',5000)}
const val=(id,v)=>{const e=$(id);if(e)e.value=v??''};
const fileToUrl=async(f)=>new Promise((resolve,reject)=>{if(!f)return resolve('');if(f.size>1024*1024)return reject(Error('Image must be under 1 MB'));const r=new FileReader;r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(f)});
const selected=(x,arr)=>arr.map(t=>'<option '+(x===t?'selected':'')+'>'+esc(t)+'</option>').join('');
const verifyUrl=c=>location.origin+'/verify?id='+encodeURIComponent(c.id);
function cert(c,print=false){return '<div class="certificate" data-theme="'+esc(c.template)+'">'+(brand.logo?'<img class="logo" style="display:block" src="'+brand.logo+'">':'')+'<div class="school">'+esc(c.school||brand.school)+'</div><div class="smallcaps">CERTIFICATE OF</div><div class="certType">'+esc(c.cert_type)+'</div><div class="intro">This certificate is proudly presented to</div><div class="student">'+esc(c.student_name)+'</div><div class="recognition">In recognition of</div><div class="course">'+esc(c.course)+'</div><div class="detail">'+esc(c.detail)+'</div><div class="certBottom"><div><b>'+esc(c.issue_date)+'</b><small>DATE OF ISSUE</small></div><div>'+(brand.signature?'<img class="signImg" style="display:block" src="'+brand.signature+'">':'<div>________________</div>')+'<b>'+esc(brand.signer)+'</b><small>AUTHORIZED SIGNATURE</small></div><div>'+(c.id?'<img class="qr" src="/api?action=qr&amp;id='+encodeURIComponent(c.id)+'"><b>'+esc(c.id)+'</b>':'<b>DRAFT • NOT ISSUED</b>')+'</div></div></div>'}
function printCert(cs){$('printArea').innerHTML=cs.map(c=>'<div class="printPage">'+cert(c,true)+'</div>').join('');const images=Array.from($('printArea').querySelectorAll('img'));Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(res=>{img.onload=res;img.onerror=res;setTimeout(res,4500)}))).then(()=>window.print())}
function store(){localStorage.setItem('certifypro_brand',JSON.stringify(brand))}
function nav(tab){active=tab;render()}
function button(t,onclick=''){return '<button class="btn" '+onclick+'>'+t+'</button>'}
function render(){if(location.pathname==='/verify'){renderVerify();return}
$('app').innerHTML='<div class="layout"><aside class="nav"><div class="brand"><i>✦</i>Certify<b>Pro</b></div><button class="'+(active==='studio'?'active':'')+'" onclick="nav('+"'studio'"+')">◈ &nbsp; Certificate Studio</button><button class="'+(active==='bulk'?'active':'')+'" onclick="nav('+"'bulk'"+')">▦ &nbsp; Bulk Import</button><button class="'+(active==='history'?'active':'')+'" onclick="nav('+"'history'"+')">▤ &nbsp; Issue History</button><button onclick="location.href='+"'"+'/verify'+"'"+'">✓ &nbsp; Public Verification</button><div class="foot">CERTIFYPRO • SCHOOL EDITION<br>Private administration, public verification.</div></aside><main class="main"><div class="top"><div><span class="eyebrow">CERTIFICATE MANAGEMENT</span><h1>'+(active==='studio'?'Certificate Studio':active==='bulk'?'Bulk Certificate Issuer':'Issued Certificates')+'</h1><p>'+(active==='studio'?'Design, issue and verify beautifully crafted certificates.':active==='bulk'?'One student list. Individually verifiable certificates.':'Search your official certificate issuance registry.')+'</p></div><button class="btn" onclick="'+(authed?'logout()':'showLogin()')+'">'+(authed?'🔓 Sign out':'🔒 Admin sign in')+'</button></div><div class="cards"><div class="card"><small>Recently issued</small><strong>'+history.length+(history.length>=100?'+':'')+'</strong></div><div class="card"><small>Certificate templates</small><strong>04</strong></div><div class="card"><small>Verification registry</small><strong style="font-size:18px">'+(configured?'Active':'Setup needed')+'</strong></div></div>'+(active==='studio'?studio():active==='bulk'?bulk():hist())+'</main></div>';if(active==='studio'){bindEditor();refreshPreview()}if(active==='bulk')bindBulk();}
function studio(){return '<div class="workspace"><section class="panel"><h2>Certificate details</h2><p class="sub">Customize your institution\'s recognition</p><label>Institution / School Name<input id="school" maxlength="100"></label><div class="two"><label>Recipient Name<input id="student_name" maxlength="100"></label><label>Certificate Type<select id="cert_type">'+selected(record.cert_type,types)+'</select></label></div><label>Course / Achievement<input id="course" maxlength="120"></label><label>Supporting statement<textarea id="detail" maxlength="200"></textarea></label><div class="two"><label>Date of Issue<input type="date" id="issue_date"></label><label>Authorized Signatory<input id="signer" maxlength="80"></label></div><div class="section">SELECT A TEMPLATE</div><div class="templates">'+templates.map((x,i)=>'<button class="template '+(x===record.template?'selected':'')+'" onclick="record.template='+"'"+x+"'"+';render()"><div class="swatch" style="background:'+['#fff3d8','#e3f5ed','#e4eafd','#e9edf3'][i]+'"></div>'+['Ivory & Gold','Emerald','Royal Blue','Minimal'][i]+'</button>').join('')+'</div><div class="section">INSTITUTION BRANDING</div><div class="two"><label>School Logo (max 1 MB)<input type="file" id="logo" accept="image/png,image/jpeg,image/webp"></label><label>Signature Image (max 1 MB)<input type="file" id="signature" accept="image/png,image/jpeg,image/webp"></label></div></section><section class="panel"><h2>Live certificate preview</h2><p class="sub">A4 landscape • printable certificate</p><div class="previewBox" id="preview"></div><div class="notice">Drafts are not verifiable. Official certificates receive unique IDs and QR codes only after issuance.</div><div class="previewActions"><button class="btn" onclick="printCert([{...record,school:brand.school}])">🖨 Print draft / Save PDF</button><button class="btn primary" onclick="issueOne()">✦ Issue verified certificate</button></div><div id="issuedNote"></div></section></div>'}
function bindEditor(){['school','signer'].forEach(k=>{val(k,brand[k]);$(k).oninput=e=>{brand[k]=e.target.value;store();refreshPreview()}});['student_name','course','detail','cert_type','issue_date'].forEach(k=>{val(k,record[k]);$(k).oninput=e=>{record[k]=e.target.value;refreshPreview()}});['logo','signature'].forEach(k=>$(k).onchange=async e=>{try{brand[k]=await fileToUrl(e.target.files[0]);store();refreshPreview()}catch(er){toast(er.message)}})}
function refreshPreview(){if($('preview'))$('preview').innerHTML=cert({...record,school:brand.school});if(issued&&$('issuedNote'))$('issuedNote').innerHTML='<div class="notice">✓ Issued '+esc(issued.id)+' · <a href="/verify?id='+encodeURIComponent(issued.id)+'" target="_blank">Verify certificate ↗</a></div>'}
function showLogin(){$('authLayer')?.remove();const d=document.createElement('div');d.id='authLayer';d.className='auth';d.innerHTML='<form class="login" onsubmit="login(event)"><h2>Administrator Sign In</h2><p class="muted">Only authorized staff can issue verified certificates.</p><label>Administrator password<input id="pwd" type="password" autocomplete="current-password" required></label><div class="authActions"><button class="btn primary" type="submit">Sign in</button><button type="button" class="btn" onclick="'+ "$('authLayer').remove()" +'">Cancel</button></div><p class="muted" id="loginError"></p></form>';document.body.append(d);$('pwd').focus()}
async function login(e){e.preventDefault();try{await request('login',{method:'POST',body:JSON.stringify({password:$('pwd').value})});$('authLayer').remove();await load();toast('Signed in successfully.')}catch(er){$('loginError').textContent=er.message}}
async function logout(){await request('logout',{method:'POST'}).catch(()=>{});authed=false;history=[];render();toast('Signed out.')}
async function load(){try{const r=await request('status');authed=r.authenticated;configured=r.configured;history=authed?(await request('list')).items:[]}catch(e){toast(e.message)}render()}
async function issueOne(){if(!authed){showLogin();return}if(!brand.school.trim()||brand.school==='Your School Name'){toast('Enter your institution name first.');return}try{const r=await request('issue',{method:'POST',body:JSON.stringify({records:[{...record,school:brand.school}]})});issued=r.records[0];await load();printCert([issued]);toast('Certificate issued and registered.')}catch(e){toast(e.message)}}
function bulk(){return '<div class="panel"><h2>Bulk import students</h2><p class="sub">Upload CSV file with Student Name, Course, Detail. Supports up to 200 students per file, issued in batches.</p><div class="drop"><strong>⬆ Choose a CSV file</strong><p class="muted">Spreadsheet can be saved as CSV from Excel</p><input type="file" accept=".csv,text/csv" id="csvFile"></div><button class="btn" onclick="downloadSample()">↓ Download sample CSV</button><p class="muted" style="margin-top:16px" id="importCount">'+imported.length+' students loaded</p><div class="tablewrap"><table><thead><tr><th>Student Name</th><th>Recognition</th><th>Detail</th></tr></thead><tbody>'+imported.slice(0,20).map(x=>'<tr><td>'+esc(x.student_name)+'</td><td>'+esc(x.course)+'</td><td>'+esc(x.detail)+'</td></tr>').join('')+'</tbody></table></div><p class="muted">You must set the institution name, certificate type and template in the Certificate Studio before bulk issuance.</p><button class="btn primary" onclick="issueBulk()" '+(!imported.length?'disabled':'')+'>✦ Issue '+imported.length+' certificates &amp; Print / Save PDF</button></div>'}
function bindBulk(){$('csvFile').onchange=async e=>{try{const s=await e.target.files[0].text();const rows=parseCsv(s);const keys=rows.shift().map(x=>x.toLowerCase().replace(/[^a-z]/g,''));const n=keys.indexOf('studentname')>=0?keys.indexOf('studentname'):keys.indexOf('name');if(n<0)throw Error('Missing Student Name column');imported=rows.filter(x=>x[n]).map(x=>({student_name:x[n],course:x[keys.indexOf('course')]||record.course,detail:x[keys.indexOf('detail')]||''}));if(imported.length>200)throw Error('Maximum 200 students per file');render();toast(imported.length+' students imported.')}catch(er){toast(er.message)}}}
function parseCsv(s){const rows=[];let row=[],field='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){field+='"';i++}else q=!q}else if(c===','&&!q){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(field);field='';if(row.some(Boolean))rows.push(row);row=[]}else field+=c}row.push(field);if(row.some(Boolean))rows.push(row);return rows}
function downloadSample(){const b=new Blob(['Student Name,Course,Detail\nAnita Kumari,Science,Excellent work\nRajesh Kumar,Math,Outstanding achievement\n'],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='certifypro-students.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function issueBulk(){if(!authed){showLogin();return}if(brand.school==='Your School Name'){toast('Set a real institution name in Studio first.');return}try{let done=[];for(let i=0;i<imported.length;i+=40){const data=imported.slice(i,i+40).map(r=>({...record,...r,school:brand.school}));const response=await request('issue',{method:'POST',body:JSON.stringify({records:data})});done.push(...response.records)}imported=[];await load();printCert(done);toast(done.length+' certificates issued. Print dialog can save PDF.')}catch(e){await load();toast('Stopped: '+e.message+' Check Issue History before retrying.')} }
function hist(){return '<div class="panel"><h2>Certificate registry</h2><p class="sub">Latest 100 issued certificates. Admin access required.</p>'+(!authed?'<div class="notice">🔒 Sign in to view the issued certificate registry.</div>':'<label>Find a certificate<input id="search" placeholder="Search name, ID or course…" oninput="filterHistory(this.value)"></label><div class="tablewrap"><table><thead><tr><th>Certificate ID</th><th>Student</th><th>Course</th><th>Issued</th><th>Action</th></tr></thead><tbody id="histBody">'+histRows(history)+'</tbody></table></div>')+'</div>'}
function histRows(arr){return arr.map(c=>'<tr><td><small>'+esc(c.id)+'</small></td><td><strong>'+esc(c.student_name)+'</strong></td><td>'+esc(c.course)+'</td><td>'+esc(c.issue_date)+'</td><td><button class="btn" onclick="printHistory('+"'"+c.id+"'"+')">Print PDF</button> <a href="/verify?id='+encodeURIComponent(c.id)+'" target="_blank">Verify ↗</a></td></tr>').join('')}
function filterHistory(q){$('histBody').innerHTML=histRows(history.filter(x=>(x.id+' '+x.student_name+' '+x.course).toLowerCase().includes(q.toLowerCase())))}
function printHistory(id){const c=history.find(x=>x.id===id);if(c)printCert([c])}
function renderVerify(){$('app').innerHTML='<main class="verifyLayout"><div class="brand" style="color:#152943"><i>✦</i>Certify<b>Pro</b></div><section class="panel"><div style="font-size:44px">✓</div><div class="eyebrow">OFFICIAL CERTIFICATE CHECK</div><h1>Verify a certificate</h1><p class="muted">Enter the certificate ID or scan its QR code to check the server-side issuance record.</p><form id="verifyForm"><label>Certificate ID<input id="verifyInput" placeholder="CP-2026-XXXXXXXXXXXX" required></label><button class="btn primary" style="width:100%;justify-content:center">Verify certificate</button></form><div id="verifyResult" class="verifyResults"></div><p style="margin-top:30px"><a href="/">← Certificate Studio</a></p></section></main>';$('verifyInput').value=new URLSearchParams(location.search).get('id')||'';$('verifyForm').onsubmit=async e=>{e.preventDefault();const box=$('verifyResult');box.textContent='Checking…';try{const r=await request('verify&id='+encodeURIComponent($('verifyInput').value.trim()));box.innerHTML=r.status==='valid'?'<div class="badge">✓ VERIFIED • AUTHENTIC</div>'+['id','student_name','school','course','cert_type','issue_date'].map(k=>'<p><b>'+esc(k.replace('_',' ').toUpperCase())+'</b><br>'+esc(r.certificate[k])+'</p>').join(''):'<div class="notice bad">⚠ '+(r.status==='revoked'?'Certificate was revoked.':'No verified certificate found for this ID.')+'</div>'}catch(er){box.textContent=er.message}};if($('verifyInput').value)$('verifyForm').requestSubmit()}
window.addEventListener('DOMContentLoaded',()=>location.pathname==='/verify'?renderVerify():load());
</script></body></html>
